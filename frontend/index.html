<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF OCR Embed</title>
  <meta name="theme-color" content="#f5f6f8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%232f6fed'/%3E%3Crect%20x='14'%20y='20'%20width='36'%20height='6'%20rx='3'%20fill='%23fff'/%3E%3Crect%20x='14'%20y='30'%20width='36'%20height='6'%20rx='3'%20fill='%23fff'%20opacity='.85'/%3E%3Crect%20x='14'%20y='40'%20width='24'%20height='6'%20rx='3'%20fill='%23fff'%20opacity='.65'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css?v=8" />
  <script>
    // Apply the saved theme before first paint to avoid a dark-mode flash.
    (function () {
      try {
        var t = localStorage.getItem("pdfocr.ui.theme") || "auto";
        var dark = t === "dark" ||
          (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#12161c" : "#f5f6f8");
      } catch (e) { /* localStorage unavailable — keep light */ }
    })();
  </script>
</head>
<body>
  <header>
    <h1>PDF OCR Embed</h1>
    <div class="header-actions">
      <select id="lang-select" class="header-select" data-i18n-title="header.language" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
      <select id="theme-select" class="header-select" data-i18n-title="header.theme" aria-label="Theme">
        <option value="auto" data-i18n="theme.auto">Auto</option>
        <option value="light" data-i18n="theme.light">Light</option>
        <option value="dark" data-i18n="theme.dark">Dark</option>
      </select>
      <span id="conn-status" class="pill">…</span>
      <button id="btn-cleanup" class="small" data-i18n="header.cleanup" data-i18n-title="header.cleanupTitle">Cleanup</button>
      <button id="btn-logs" class="small" data-i18n="header.logs">Logs</button>
      <button id="btn-settings" data-i18n="header.settings">Settings</button>
    </div>
  </header>

  <main>
    <!-- Upload / landing -->
    <section id="upload-zone" class="card">
      <input type="file" id="file-input" accept="application/pdf" hidden />
      <label id="drop-zone" for="file-input">
        <strong data-i18n="upload.drop">Drop a scanned PDF here</strong>
        <span data-i18n="upload.orClick">or click to choose a file. Pages are rasterized, OCR'd, and made searchable.</span>
      </label>
      <div class="upload-opts">
        <label class="inline-label"><span data-i18n="upload.engine">OCR engine</span>
          <select id="adapter">
            <option value="unlimited" data-i18n="upload.engine.unlimited">Unlimited OCR (API)</option>
            <option value="tesseract" data-i18n="upload.engine.tesseract">Tesseract (local)</option>
            <option value="generic_openai" data-i18n="upload.engine.generic">Generic OpenAI (API)</option>
          </select>
        </label>
        <label class="inline-label" id="tess-lang-row"><span data-i18n="upload.lang">Tesseract language</span>
          <input id="tess-lang" type="text" placeholder="chi_sim" />
        </label>
        <label class="inline-label"><span data-i18n="upload.concurrency">Parallel OCR pages</span>
          <input id="concurrency" type="number" min="1" max="32" value="1" />
        </label>
        <span class="hint" id="adapter-hint"></span>
        <span class="hint" id="upload-msg"></span>
      </div>
    </section>

    <!-- Jobs: everything the server knows about, running or finished.
         Several jobs can run in parallel; each has its own card + live SSE. -->
    <section id="jobs-section" class="card hidden">
      <div class="row">
        <h2 data-i18n="jobs.title">Jobs</h2>
        <span class="hint" data-i18n="jobs.hint">All tasks on the server — close this page and come back anytime, they survive.</span>
      </div>
      <div id="jobs-list"></div>
    </section>

    <!-- Page list + preview -->
    <section id="workspace" class="hidden">
      <div class="toolbar">
        <span id="editing-job"></span>
        <button id="btn-prev" data-i18n-title="workspace.prev">◀</button>
        <span id="page-tabs"></span>
        <button id="btn-next" data-i18n-title="workspace.next">▶</button>
        <span id="zoom-label"></span>
        <input id="zoom" type="range" min="50" max="200" value="100" />
      </div>
      <div id="panes">
        <div id="editor-pane" class="pane">
          <h3 data-i18n="workspace.blockTitle">Editable text blocks</h3>
          <div id="blocks"></div>
        </div>
        <div id="preview-pane" class="pane">
          <h3 data-i18n="workspace.previewTitle">Page preview</h3>
          <div id="preview-wrap">
            <img id="preview-img" data-i18n-alt="workspace.previewTitle" alt="page preview" />
            <canvas id="overlay-canvas"></canvas>
          </div>
        </div>
      </div>
      <div class="embed-bar">
        <label class="inline-label" data-i18n-title="workspace.embedFontTitle"><span data-i18n="workspace.embedFont">Embed font</span>
          <select id="embed-font">
            <option value="" data-i18n="workspace.autoFont">Auto (default)</option>
          </select>
        </label>
        <button id="btn-preview" class="small" data-i18n="workspace.previewOverlay" data-i18n-title="workspace.previewOverlayTitle">Preview overlay</button>
        <button id="btn-embed" class="primary" disabled data-i18n="workspace.embed" data-i18n-title="workspace.embedTitle">Embed invisible text</button>
        <a id="download-link" class="hidden" download></a>
        <span id="embed-status"></span>
        <span class="spacer"></span>
        <button id="btn-dataset" class="small" data-i18n="workspace.downloadDataset" data-i18n-title="workspace.downloadDatasetTitle">Download dataset (JSON)</button>
      </div>
      <p class="embed-hint" id="embed-hint" data-i18n-html="workspace.hint"></p>
    </section>
  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2 data-i18n="settings.title">OCR Settings</h2>
      <p class="hint" data-i18n-html="settings.hint"></p>
      <label><span data-i18n="settings.provider">Provider preset</span>
        <select id="set-provider">
          <option value="ustc" data-i18n="settings.provider.ustc">USTC (OpenAI-compatible)</option>
          <option value="openai" data-i18n="settings.provider.openai">OpenAI</option>
          <option value="custom" data-i18n="settings.provider.custom">Custom</option>
        </select>
      </label>
      <label><span data-i18n="settings.baseurl">Base URL</span>
        <input id="set-baseurl" type="url" placeholder="https://api.llm.ustc.edu.cn/v1" />
      </label>
      <label><span data-i18n="settings.model">Model</span>
        <input id="set-model" type="text" placeholder="glm-4v-flash" />
      </label>
      <label><span data-i18n="settings.apikey">API Key</span>
        <input id="set-apikey" type="password" placeholder="sk-… (masked if already set)" />
      </label>
      <div class="modal-actions">
        <button id="btn-settings-save" class="primary" data-i18n="settings.save">Save</button>
        <button id="btn-settings-cancel" data-i18n="settings.cancel">Cancel</button>
      </div>
      <div id="settings-status"></div>
    </div>
  </div>

  <!-- Temp-file cleanup modal -->
  <div id="cleanup-modal" class="modal hidden">
    <div class="modal-box">
      <h2 data-i18n="cleanup.title">Temporary file cleanup</h2>
      <p class="hint" data-i18n-html="cleanup.intro"></p>
      <p class="hint">
        <span data-i18n="cleanup.interval"></span>
        <span id="cleanup-interval" class="code-badge">—</span>
        <span data-i18n="cleanup.hoursUnit"></span>
      </p>
      <div id="cleanup-summary" class="cleanup-summary"></div>
      <label><span data-i18n="cleanup.olderThan">Delete unreferenced files older than</span>
        <input id="cleanup-max-age" type="number" min="1" step="1" /> <span data-i18n="cleanup.hoursUnit"></span>
      </label>
      <div class="modal-actions">
        <button id="btn-cleanup-preview" data-i18n="cleanup.preview">Preview</button>
        <button id="btn-cleanup-run" class="primary" data-i18n="cleanup.cleanNow">Clean now</button>
        <button id="btn-cleanup-cancel" data-i18n="cleanup.cancel">Cancel</button>
      </div>
      <div id="cleanup-status"></div>
    </div>
  </div>

  <!-- Debug log panel -->
  <section id="debug-panel" class="card hidden">
    <div class="row">
      <h3 data-i18n="logs.title">Debug logs</h3>
      <div>
        <button id="btn-refresh-logs" class="small" data-i18n="logs.refresh">Refresh</button>
        <label class="inline-check"><input id="auto-log" type="checkbox" checked /> <span data-i18n="logs.auto">Auto</span></label>
      </div>
    </div>
    <pre id="log-box"></pre>
  </section>

  <script src="/static/i18n.js?v=8"></script>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
