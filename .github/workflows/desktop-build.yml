name: desktop-build

on:
  push:
    branches: [main]
    # A full three-OS build is not worth spending on a docs edit.  Workflow
    # changes are not ignored, so tweaking this file still triggers a run.
    paths-ignore:
      - "**.md"
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: never spend 3× OS minutes building a broken commit.
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # A few pinned tests (tests/test_job_persistence.py) run OCRmyPDF's
          # REAL finalize, whose preflight demands a tesseract on PATH — the
          # runner image does not ship one.  This is the cheap gate; it must
          # exercise the same real pipeline the build's smoke test does.
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Run the test suite
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: pdf-ocr-embed-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            artifact: pdf-ocr-embed-windows-x86_64
          - os: macos-latest
            name: macos-arm64
            artifact: pdf-ocr-embed-macos-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.15"

      # Windows uses WebView2 and macOS WKWebView; pywebview pulls in the
      # platform bindings (pythonnet / pyobjc) by itself.
      - name: Install the window backend (Windows / macOS)
        if: runner.os != 'Linux'
        run: pip install pywebview

      # The Windows tray backend is a runtime dynamic import (the spec can only
      # collect what is installed) — without pystray the artifact silently
      # ships tray-less, the same failure mode as the missing WebKit typelib.
      - name: Install the tray backend (Windows)
        if: runner.os == 'Windows'
        run: pip install "pystray>=0.19"

      # Linux needs GTK + WebKit2GTK and a matching PyGObject.  This is the one
      # genuinely fragile part (girepository-1.0 vs 2.0 across distros), so it is
      # best-effort: if it fails the bundle is still built and the app simply
      # falls back to the system browser.
      - name: Linux native window — GTK stack (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          # The tray's GIR packages are a bonus and absent on some runners —
          # check they exist first, because apt aborts the whole (set -e)
          # step, including the pywebview install, on a missing package name.
          tray_pkgs=""
          for p in gir1.2-ayatanaappindicator3-0.1 gir1.2-appindicator3-0.1; do
            apt-cache show "$p" >/dev/null 2>&1 && tray_pkgs="$tray_pkgs $p"
          done
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1 $tray_pkgs
          pip install "pywebview[gtk]"

      # A host Tesseract is only the *source* we copy from; the app ships its
      # own copy so users need nothing installed.  Best effort: without a host
      # the bundle is still built and simply needs a system tesseract.
      - name: Install Tesseract to bundle (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Install Tesseract to bundle (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          brew install tesseract
          tesseract --version

      - name: Install Tesseract to bundle (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          choco install tesseract --no-progress -y
          # Chocolatey updates PATH for *new* shells only; later steps in this
          # job would not see tesseract without exporting it explicitly.
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Build the bundle
        run: python packaging/build.py --clean --with-tesseract

      # Only demand a bundled Tesseract when the staging step actually produced
      # one, so a runner without a host tesseract does not fail the build.
      # With Tesseract present we also run the FULL pipeline on this OS:
      # upload -> OCRmyPDF -> tesseract -> invisible text layer -> download,
      # asserting the produced PDF is actually searchable.
      # WebKit2 is this project's silent-failure mode: PyInstaller has no hook
      # for that gi namespace (the spec collects the typelib closure itself),
      # and a runner that lost the best-effort GTK step above would STILL build
      # — quietly, browser-only.  Fail loudly instead of shipping an artifact
      # without a native window.
      - name: Verify the bundle has the window + tray typelibs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! compgen -G "dist/pdf-ocr-embed/_internal/gi_typelibs/WebKit2-*.typelib" >/dev/null; then
            echo "::error::No WebKit2 typelib in the bundle — the frozen app would fall back to the browser. Check the 'Linux native window — GTK stack' step; a failure there lands here."
            exit 1
          fi
          if ! compgen -G "dist/pdf-ocr-embed/_internal/gi_typelibs/*ppIndicator3-*.typelib" >/dev/null; then
            echo "::warning::No AppIndicator typelib in the bundle — the frozen Linux app has no system tray (closing the window quits)."
          fi

      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ -d packaging/tesseract-staging ]; then
            python packaging/smoke_test.py --expect-tesseract --ocr
          else
            python packaging/smoke_test.py
          fi

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/pdf-ocr-embed
          if-no-files-found: error
          retention-days: 14
