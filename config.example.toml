# PDF OCR Embed — example configuration (TOML).
#
# Copy this file to `backend/ocr_config.toml` and fill in your values:
#   cp config.example.toml backend/ocr_config.toml
#
# `backend/ocr_config.toml` is gitignored — never commit real API keys.
# Every key below is optional; the backend falls back to built-in defaults
# when a key is absent.
#
# Optional environment overrides: any `OCR_*` environment variable has the
# HIGHEST priority and overrides this file and WebUI-saved values, e.g.
#   OCR_API_KEY=sk-xxx OCRMYPDF_MODE=force python -m backend.main
# Full mapping (see README.md): OCR_API_KEY / USTC_API_KEY (alias) -> api_key,
# OCR_BASE_URL -> base_url, OCR_MODEL -> model, OCR_PROVIDER -> provider,
# OCR_ENGINE -> ocr_engine, OCR_MAX_RETRIES -> max_retries,
# OCR_RETRY_BASE_DELAY -> retry_base_delay, OCR_RETRY_MAX_DELAY ->
# retry_max_delay, OCR_RATE_LIMIT_RPS -> rate_limit_rps,
# OCRMYPDF_MODE/JOBS/OPTIMIZE/OUTPUT_TYPE/LANGUAGE/DESKEW/CLEAN/
# ROTATE_PAGES -> ocrmypdf_*, OCR_CLEANUP_MAX_AGE_HOURS ->
# cleanup_max_age_hours, OCR_CLEANUP_INTERVAL_HOURS -> cleanup_interval_hours,
# OCR_LOG_LEVEL -> log_level.

# --- Primary (OpenAI-compatible) OCR engine -------------------------------
provider = "ustc"                            # provider preset: "ustc" | "openai" | "custom"
api_key = "your-key-here"                    # required for the unlimited engine
base_url = "https://api.llm.ustc.edu.cn/v1"  # any OpenAI-compatible endpoint
model = "unlimited-ocr"                      # model / deployment name

# --- Engine selection -------------------------------------------------------
# ocr_engine = "unlimited"                   # "unlimited" (plugin) | "tesseract" (ocrmypdf built-in) | "none"

# --- ocrmypdf pipeline knobs (see backend/ocr_service.py) -------------------
# ocrmypdf_mode = "force"                    # force | skip | redo | default
# ocrmypdf_jobs = 0                          # worker count (0 = auto / cpu count)
# ocrmypdf_optimize = 0                      # 0..3, applied at finalize
# ocrmypdf_output_type = "pdf"               # pdf | pdfa
# ocrmypdf_language = ""                     # tesseract needs it; unlimited ignores it
# ocrmypdf_deskew = false                    # deskew pages before OCR (boolean)
# ocrmypdf_clean = false                     # clean pages before OCR (needs unpaper)
# ocrmypdf_rotate_pages = false              # auto-rotate (needs an OSD-capable engine)

# --- HTTP retry + rate limiting (unlimited engine API calls) ----------------
# Applies to every API call; does NOT change OCR output.
# max_retries = 3                            # retries after the first attempt (0 = no retry)
# retry_base_delay = 1.0                     # initial backoff seconds (exponential, +jitter)
# retry_max_delay = 30.0                     # upper bound on backoff delay
# rate_limit_rps = 0                         # requests/second cap (0 = disabled)

# --- Temp-file cleanup (see backend/cleanup.py) ----------------------------
cleanup_max_age_hours = 168                  # delete unreferenced files after 7 days
cleanup_interval_hours = 6                   # background cleanup re-run interval

# --- Logging (see backend/logging_config.py) -------------------------------
log_level = "INFO"                           # "DEBUG" | "INFO" | "WARNING" | "ERROR"
