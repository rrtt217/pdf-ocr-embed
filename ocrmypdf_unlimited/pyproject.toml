[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-unlimited"
version = "1.0.0"
description = "Standalone OCRmyPDF plugin providing the Unlimited-OCR vision engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ocrmypdf>=17.11",
    "httpx>=0.27.0",
    "Pillow>=9.0",
    "pylatexenc>=2.10",
]

[project.entry-points."ocrmypdf"]
# Auto-load the plugin whenever ocrmypdf and this package share a venv, and
# let `ocrmypdf --plugin ocrmypdf_unlimited` select it explicitly.
unlimited = "ocrmypdf_unlimited"

[tool.setuptools]
# This directory IS the package: pyproject.toml sits next to __init__.py, so
# the `ocrmypdf_unlimited` package maps to the project root (".").
packages = ["ocrmypdf_unlimited"]

[tool.setuptools.package-dir]
ocrmypdf_unlimited = "."
